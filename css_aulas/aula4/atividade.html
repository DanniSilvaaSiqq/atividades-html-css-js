<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Bordas</title>

    <style>

        h1 {
            border-bottom: 9px Dotted;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            background-color: orange;

            padding: 10px;

        }

        p {
            padding: 10px;
            
            border-left: 9px solid darkslateblue;
            border-right: 9px solid darkslateblue;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px; 

            background-color: rgba(73, 73, 239, 0.567);

        }

    </style>

</head>
<body>
    
    <h1>Modelo de Caixa</h1>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore necessitatibus tenetur, temporibus autem officia libero illo, quasi iure dolorem quae ea expedita magni ullam voluptatum ab labore. Eligendi, maiores voluptatibus.</p>

</body>
</html>
