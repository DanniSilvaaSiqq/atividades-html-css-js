<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatacao de Texto</title>
</head>
<body>
    
    <!--

    <b> (Bold - negrito) representa um texto diferente do normal
    <strng> (forte) representa um texto com importancia
    <em> (emphasi - enfase) coloca alguma enfase no texto
    <mark> (marca) representa o texto marcado
    
    -->


    <h2>Formatacoes de textos</h2>
    Esse é um texto em <b>negrito</b> <br>
    Esse é um texto <strong>Importante</strong> <br>
    Esse é um texto <i>Itálico</i> <br>
    Esse é um texto <em>Enfase</em> <br>
    Esse é um texto <mark>Marcado</mark> <br>


    <!--

    <u> (underline - sublinhado ) texto com sublinhado
    <del> (deleted - apagado) texto com marcacao de apagado

    -->
    <br>
    Esse é um texto <u>Sublinhado</u> <br>
    Esse é um texto <del>Apagado</del> <br>

    <!--
    
    <sup> (Superscript text - sobrescrito)
    <sub> (subscript text - subscrito)
    
    -->

    <h2>Diferentes tipos de caracteres</h2>
    Sobrescrito: 10<sup>2</sup> <br>
    Subscrito: H<sub>2</sub>0 <br>


</body>
</html>
