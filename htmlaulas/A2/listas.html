<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas HTML</title>
</head>
<body>

    <!--
        <ul> -> Unordered List (Lista nao ordenada)
        <ol> -> Ordered List (Lista Ordenada)
        <li> -> List Item (item da lista)
    
    -->

    <!--
    type="disc"circle, square, disc
    style="list-style-type:square"
    
    -> Forma de estilizar (nao pratica) <-

    -->


        <h2>Lista Nao Ordenada</h2>
        <hr>
        <ul style="list-style-type: square;">
            
            <li>Java</li>
            <li>JavaScript</li>

        </ul>

        <!--
        
        type="1" 1, a, A, i, I
        style="list-style-type: upper-roman;"
        
        -->

        <h2>Lista Ordenada</h2>
        <hr>
        <ol>

            <li>HTML</li>
            <ul>
                <li>Estrutura da página</li>
            </ul>
            
            <li>CSS</li>
            <ul>
                <li>Estilizacao</li>
            </ul>
            
            <li>JavaScript</li>
            <ul>
                <li>Script / acoes</li>
            </ul>

        </ol>

</body>
</html>
