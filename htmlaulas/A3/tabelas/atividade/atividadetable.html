<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <h1>Tabela - Exercicio</h1>

    <table border="1">

        <tbody>
            <tr>
                <td>1</td>
                <td>Índia</td>
                <td>1,47 bilhão</td>
            </tr>

            <tr>
                <td>2</td>
                <td>China</td>
                <td>1,41 bilhão</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Estados Unidos</td>
                <td>349 milhões</td>
            </tr>

            <tr>
                <td>4</td>
                <td>Indonésia</td>
                <td>287 milhões</td>
            </tr>

            <tr>
                <td>5</td>
                <td>Paquistão</td>
                <td>259 milhões</td>
            </tr>

            <tr>
                <td>6</td>
                <td>Nigéria</td>
                <td>242 milhões</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Fonte: Google</td>
            </tr>
        </tfoot>

    </table>




</body>
</html>
