<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas 2</title>
</head>
<body>
    <h1>Tabelas 2</h1>

    <!--
        table -> Tabela
        tr -> Table Row (Linha da Tabela)
        td -> Table Data (Dados da Tabela) * Table Cell (Célula da tabela)
        th -> Table Header (Cabecalho da tabela)
    -->

    <table border="1">
        <tr>
            <td>Conteudo 1</td>
            <td>Conteudo 2</td>
        </tr>
    </table>

    
</body>
</html>
