<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de formulario</title>
</head>
<body>
    <h1>Exercícios de Formulários</h1>

    <form action="processa.html">
    <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome"><br><br>

        <label for="email">Email:</label>
        <input type="text" name="email" id="email"><br>

        <input type="checkbox" name="receberemail" value="receber" id="receber">
        <label for="receber">Quero receber e-mail</label><br><br>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha">

    </fieldset>
    </form>


    <fieldset>
        <legend>Informações Adicionais</legend>
        
        <input type="radio" name="infoadd" value="pf" id="pf">
        <label for="pf">Pessoa Física</label>

        <input type="radio" name="infoadd" value="pj" id="pj">
        <label for="pj">Pessoa Jurídica</label>

    </fieldset><br>

    <button>Cadastrar</button>


</body>
</html>
