<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais Componentes</title>
</head>
<body>
    
    <h1>Mais Componentes / Formulários</h1>
    <hr>

    <form action="" method="get">

    <h2>Label</h2>

    <!--
        label -> Legenda para item da interface
        for -> para
    -->

    <!-- Nao recomendado fazer assim -->
    <label>
        Nome:
        <input type="text" name="nome">
    </label>    
    
    <!--Melhor forma de escrever -->
    <label for="email">Email:</label>
    <input type="text" name="email" id="email">

    <br>

    <h3>Botoes de rádio</h3>

    Genero<br>

    <input type="radio" name="genero" value="feminino" id="feminino">
    <label for="feminino">Feminino</label>

    <input type="radio" name="genero" value="masculino" id="masculino">
    <label for="masculino">Masculino</label>
    
    <br><br>

    
    Estilo Musica<br>
    

    <input type="checkbox" name="estilo" value="rock" id="rock">
    <label for="rock">Rock</label>
    
    <input type="checkbox" name="estilo" value="pop" id="pop">
    <label for="pop">Pop</label>
    
    <input type="checkbox" name="estilo" value="metal" id="metal">
    <label for="metal">Metal</label>

    <br><br>

    Estados:
    <select name="estado">  
        <option>Selecione:</option>
        <option value="sp">São Paulo</option>
        <option value="rj">Rio de Janeiro</option>
        <option value="mg">Minas Gerais</option>
        <option value="ce">Ceará</option>
    </select>

    <br><br>

    Upload de arquivos:
    <input type="file" name="arquivo">

    <br><br>
    <input type="submit" value="cadastrar"> 

</form>

<form>

    <h3>Fieldset e legend</h3>

    <!--
        Fieldset -> Conjunto de campos
        Legend -> Legenda para conjunto
    -->

    <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome2">Nome:</label>
        <input type="text" name="nome" id="nome2">

        <label for="email2">Email:</label>
        <input type="text" name="email" id="email2">
    </fieldset>

    <fieldset>
        <legend>Dados Pessoais</legend>

        Genero<br>

        <input type="radio" name="genero" value="feminino" id="feminino">
        <label for="feminino">Feminino</label>

        <input type="radio" name="genero" value="masculino" id="masculino">
        <label for="masculino">Masculino</label>

    </fieldset>
    

</form>

</body>
</html>
